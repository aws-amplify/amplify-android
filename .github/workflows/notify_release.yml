# This is a basic workflow to help you get started with Actions

name: Notify Amplify Android Release

# Controls when the workflow will run
on:
  # Triggers the workflow on release created (draft) or published (release and prerelease) events but only for the main branch
  release:
    types: [created, published]

# This workflow only posts to an external webhook — it makes no GitHub API
# calls and checks out no code, so the GITHUB_TOKEN needs no scopes.
permissions: {}

jobs:
  # This workflow contains a single job called "notify"
  notify:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs a single command using the runners shell
      - name: Run webhook curl command
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          VERSION: ${{github.event.release.html_url}}
          REPO_URL: ${{github.event.repository.html_url}}
          ACTION_NAME: ${{github.event.action}}
        shell: bash
        run: |
          payload="$(jq -n \
            --arg action "$ACTION_NAME" \
            --arg repo "$REPO_URL" \
            --arg version "$VERSION" \
            '{action: $action, repo: $repo, version: $version}')"
          curl -sSf --max-time 30 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$payload"

