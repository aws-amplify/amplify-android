/*
Need to create backends for s3, pinpoint, predictions, core
 */
def module_backends = [
        'aws-datastore'         : 'DataStoreIntegTests',
        'aws-api'               : 'ApiInstrumentedTests',
        'aws-geo-location'      : 'GeoIntegTests',
        'maplibre-adapter'      : 'GeoIntegTests',
        'aws-storage-s3'        : 'NONE',
        'aws-predictions'       : 'NONE',
        'core'                  : 'NONE',
        'aws-auth-cognito'      : 'AuthIntegrationTests',
        'aws-sdk-appsync-events': 'NONE',
        'aws-kinesis'           : 'KinesisIntegrationTests',
        'aws-cloudwatch'        : 'NONE'
]

def module_subpaths = [
        'aws-sdk-appsync-events': 'appsync/'
]

def scriptsDir = layout.projectDirectory.dir("scripts")

def canaryTests = [
        'aws-datastore'   : ['com.amplifyframework.datastore.DatastoreCanaryTest'],
        'aws-auth-cognito': ['com.amplifyframework.auth.cognito.AuthCanaryTest'],
        'aws-geo-location': ['com.amplifyframework.geo.location.GeoCanaryTest'],
        'aws-predictions': ['com.amplifyframework.predictions.aws.PredictionsCanaryTest'],
        'aws-storage-s3': ['com.amplifyframework.storage.s3.StorageCanaryTest'],
        'aws-kinesis': ['com.amplifyframework.kinesis.KinesisDataStreamsInstrumentationTest']
]

/*
 * Uses injected ExecOperations because Gradle 9 removed Project.exec and configuration-cache task
 * actions cannot capture Project.
 */
abstract class RunScriptTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getScript()

    @Input
    abstract ListProperty<List<String>> getArgumentLists()

    // Every registration passes rootDir; the scripts resolve ./scripts and module paths from there.
    @Internal
    abstract DirectoryProperty getWorkingDir()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void run() {
        def directory = workingDir.get().asFile
        argumentLists.get().each { arguments ->
            execOperations.exec { spec ->
                spec.workingDir(directory)
                spec.commandLine([script.get().asFile.absolutePath] + arguments)
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (module_backends.containsKey(project.name)) {
            def moduleWithSubPath = module_subpaths.get(project.name) ?
                    module_subpaths.get(project.name) + project.name : project.name
            tasks.register('runTestsInDeviceFarm', RunScriptTask) {
                workingDir = rootDir
                script = scriptsDir.file("run_test_in_devicefarm.sh")
                argumentLists = [[moduleWithSubPath]]
            }
            tasks.register('runCanaryInDeviceFarm', RunScriptTask) {
                dependsOn('assembleAndroidTest')
                workingDir = rootDir
                script = scriptsDir.file("run_canary_in_devicefarm.sh")
                argumentLists = (canaryTests[project.name] ?: []).collect { canary ->
                    [project.name, canary]
                }
            }
        }
    }
}

tasks.register('pullBackendConfigFromAmplify', RunScriptTask) {
    description = "Pulls backend configurations from Amplify project."
    workingDir = rootDir
    script = scriptsDir.file("pull_backend_config_from_amplify")
    argumentLists = module_backends.collect { moduleName, amplifyBackendProjectName ->
        [amplifyBackendProjectName, moduleName]
    }
}
